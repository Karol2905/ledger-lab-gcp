# Construye la imagen y la publica en GitHub Container Registry. Usa GITHUB_TOKEN: no toca Google Cloud.
# Cloud Run la descarga despues a traves del repositorio remoto de Artifact Registry, con el mismo digest.
name: publish-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publicar imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Calcular el nombre de la imagen
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/ledger" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          # Vincula un paquete nuevo con este repositorio, para que GITHUB_TOKEN pueda volver a publicarlo.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Mostrar el digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "Use este digest al ejecutar el workflow **deploy**:"
            echo
            echo '```'
            echo "$DIGEST"
            echo '```'
            echo
            echo "Imagen completa: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
